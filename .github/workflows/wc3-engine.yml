# Warcraft III, фаза 0 (KNOWN_ISSUES.md, раздел G): сборка веб-порта Warsmash на закреплённом коммите.
#
# Зачем: в среде разработки нет доступа к Maven Central и npm, поэтому сборка проверяется здесь.
# Результат — артефакт wc3-warsmash (7 дней) для ручной проверки по TEST_PLAN.md, раздел 5:
# скачать, распаковать, `python3 -m http.server 8000` в его каталоге, открыть http://127.0.0.1:8000/.
#
# На сайт (pages.yml, образ web) эта сборка НЕ попадает: интеграция — фаза 1, после решения по движку.
# Запуск вручную: Actions → wc3-engine → Run workflow. Сам запускается при изменении скрипта сборки и патчей.
name: wc3-engine

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/build-wc3.sh
      - vendor-patches/wc3/**
      - .github/workflows/wc3-engine.yml

permissions:
  contents: read

concurrency:
  group: wc3-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Warsmash — сборка на закреплённом коммите
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Gradle 7.3.3 из wrapper Warsmash на JDK 21 не запускается
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Сборка (scripts/build-wc3.sh)
        run: |
          set -o pipefail
          WC3_LOG="$RUNNER_TEMP/wc3-build.log" scripts/build-wc3.sh "$RUNNER_TEMP/wc3" 2>&1 | tee "$RUNNER_TEMP/wc3-script.log"

      # Сводка — в аннотацию и в Summary: видно на странице запуска без скачивания артефакта
      - name: Что собралось
        run: |
          out="$RUNNER_TEMP/wc3"
          {
            cat "$out/BUILD-INFO.txt"
            echo
            echo "Скрипт сборки:"
            grep -E '==>|✓|ВНИМАНИЕ|ОШИБКА' "$RUNNER_TEMP/wc3-script.log" | sed 's/^/  /'
            echo
            echo "Размер: $(du -sh "$out" | cut -f1), файлов: $(find "$out" -type f | wc -l)"
            echo "Файлы больше 256 КБ:"
            (cd "$out" && find . -type f -size +256k -printf '%s %P\n' | sort -k2 | awk '{printf "  %.1f МБ  %s\n", $1/1048576, $2}')
            echo "Страницы: $(cd "$out" && find . -name index.html -printf '%P ' | sort)"
          } > "$RUNNER_TEMP/wc3-summary.txt"
          cat "$RUNNER_TEMP/wc3-summary.txt"
          { echo '```'; cat "$RUNNER_TEMP/wc3-summary.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          body=$(sed -e 's/%/%25/g' -e 's/\r//g' "$RUNNER_TEMP/wc3-summary.txt" | awk 'BEGIN{ORS="%0A"}{print}')
          echo "::notice title=Сборка Warsmash::${body}"

      - uses: actions/upload-artifact@v4
        with:
          name: wc3-warsmash
          path: ${{ runner.temp }}/wc3
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wc3-build-log
          path: |
            ${{ runner.temp }}/wc3-build.log
            ${{ runner.temp }}/wc3-script.log
          if-no-files-found: ignore
          retention-days: 7

      # Хвост лога — в аннотацию: её видно на странице запуска без скачивания логов
      - name: Ошибка сборки → аннотация
        if: failure()
        run: |
          for f in "$RUNNER_TEMP/wc3-build.log" "$RUNNER_TEMP/wc3-script.log"; do
            [ -s "$f" ] || continue
            body=$(grep -vE '^[[:space:]]*$' "$f" | tail -n 40 | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=Последние строки ${f##*/}::${body}"
          done
