name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Нет файлов игр
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-no-valve-files.sh

  web:
    name: web — typecheck и сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Клиент cs16-client (снят с npm — файлы с jsDelivr, хеши сверяются)
        run: node scripts/fetch-cs16-client.mjs
      - name: Зависимости
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 7

  api:
    name: api — проверка и тесты
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config -q
      - run: docker compose -f docker-compose.yml -f docker-compose.steamcmd.yml config -q
      - name: docker compose config (сигналинг Warcraft III)
        run: WC3_SIGNALING_DB_PASSWORD=ci docker compose -f docker-compose.yml -f docker-compose.wc3-signaling.yml config -q
      - name: Рендер шаблонов (scripts/deploy.sh --render-only)
        run: |
          sed -i \
            -e 's/^DOMAIN=.*/DOMAIN=ci.test.invalid/' \
            -e 's/^PUBLIC_IP=.*/PUBLIC_IP=192.0.2.1/' \
            -e 's/^ACME_EMAIL=.*/ACME_EMAIL=ci@test.invalid/' \
            -e "s/^RCON_PASSWORD=.*/RCON_PASSWORD=$(openssl rand -hex 12)/" \
            -e "s/^TURN_SECRET=.*/TURN_SECRET=$(openssl rand -hex 24)/" .env
          scripts/deploy.sh --render-only
          grep -q '^listening-port=3478$' deploy/coturn/turnserver.conf
          grep -q '^hostname "' deploy/cs-server/server.cfg

  images:
    name: Сборка образов
    needs: [web, api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Образ web (Caddy + статика + Warsmash)
        run: |
          set -o pipefail
          docker buildx build --platform linux/amd64 --progress=plain \
            --build-arg NODE_IMAGE=node:22-alpine \
            --build-arg CADDY_IMAGE=caddy:2.11-alpine \
            --build-arg WITH_WC3=1 \
            -f web/Dockerfile -t cs16-web/web:ci . 2>&1 | tee "$RUNNER_TEMP/web-image.log"
      # Хвост лога — в аннотацию (логи job'ов лежат во внешнем хранилище)
      - name: Ошибка сборки образа web → аннотация
        if: failure()
        run: |
          f="$RUNNER_TEMP/web-image.log"
          [ -s "$f" ] || exit 0
          body=$(grep -vE '^[[:space:]]*$' "$f" | tail -n 60 | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"}{print}')
          echo "::error title=Последние строки сборки образа web::${body}"
      - name: Образ api
        run: |
          docker buildx build --platform linux/amd64 \
            --build-arg NODE_IMAGE=node:22-alpine \
            -t cs16-web/api:ci api

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --version
      - name: shellcheck scripts/*.sh
        run: |
          # -f gcc → по строке на замечание; каждое выводится аннотацией на странице запуска
          if ! shellcheck -x -P scripts -f gcc scripts/*.sh > shellcheck.txt; then
            sed 's/^/::error::/' shellcheck.txt
            exit 1
          fi
