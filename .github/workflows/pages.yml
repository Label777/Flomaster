# Публикация сайта на GitHub Pages: https://<владелец>.github.io/<репозиторий>/
#
# Один раз: Settings → Pages → Build and deployment → Source: «GitHub Actions».
# Без игрового сервера сайт работает в офлайн-режиме. Чтобы подключить серверы на VPS,
# задайте переменную репозитория API_BASE (Settings → Secrets and variables → Actions →
# Variables), например https://cs.example.com, а на VPS в .env — ALLOWED_ORIGINS=https://<владелец>.github.io
# Warcraft III собирается здесь же (Warsmash, JDK 17). Свой сигналинг для его сетевой игры —
# переменная WC3_SIGNALING (wss://…/wc3-signaling/v0/signaling), иначе сервер Poki.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Warcraft III (Warsmash) собирается TeaVM на JDK 17
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: "Проверка: в репозитории нет файлов игр"
        run: bash scripts/check-no-valve-files.sh

      - name: Клиент cs16-client (снят с npm — файлы с jsDelivr, хеши сверяются)
        working-directory: web
        run: |
          set -o pipefail
          node scripts/fetch-cs16-client.mjs 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Warcraft III — сборка Warsmash (web/public/games/wc3)
        working-directory: web
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # Свой сервер сигналинга (docker-compose.wc3-signaling.yml); пусто — сервер Poki
          VITE_WC3_SIGNALING: ${{ vars.WC3_SIGNALING }}
          WC3_LOG: ${{ runner.temp }}/wc3-build.log
        run: |
          set -o pipefail
          node scripts/fetch-wc3.mjs 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Установка зависимостей
        working-directory: web
        run: |
          set -o pipefail
          if [ -f package-lock.json ]; then cmd="npm ci"; else cmd="npm install"; fi
          $cmd --no-audit --no-fund 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Сборка
        working-directory: web
        env:
          # Сайт живёт в подкаталоге /<репозиторий>/
          VITE_BASE: /${{ github.event.repository.name }}/
          # '' не подходит: на Pages нет /api. 'none' = только офлайн.
          VITE_API_BASE: ${{ vars.API_BASE || 'none' }}
          # Pages не даёт задать COOP/COEP — их добавляет service worker
          VITE_COI_SW: '1'
          # Pages сжимает ответы сам и не отдаёт .br/.gz
          POSTBUILD_NO_COMPRESS: '1'
        run: |
          set -o pipefail
          npm run build 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Без Jekyll
        run: touch web/dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      # Хвост лога — в аннотацию: её видно на странице запуска без скачивания логов
      - name: Ошибка сборки → аннотация
        if: failure()
        run: |
          f="$RUNNER_TEMP/build.log"
          [ -f "$f" ] || exit 0
          # Если упала сборка Warsmash, подробности — в её собственном логе
          if [ -s "$RUNNER_TEMP/wc3-build.log" ] && grep -q 'ОШИБКА' "$f"; then f="$RUNNER_TEMP/wc3-build.log"; fi
          body=$(grep -vE '^[[:space:]]*$' "$f" | tail -n 40 | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"}{print}')
          echo "::error title=Последние строки лога сборки::${body}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
