# Публикация сайта на GitHub Pages: https://<владелец>.github.io/<репозиторий>/
#
# Один раз: Settings → Pages → Build and deployment → Source: «GitHub Actions».
# Без игрового сервера сайт работает в офлайн-режиме. Чтобы подключить серверы на VPS,
# задайте переменную репозитория API_BASE (Settings → Secrets and variables → Actions →
# Variables), например https://cs.example.com, а на VPS в .env — ALLOWED_ORIGINS=https://<владелец>.github.io
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "Проверка: в репозитории нет файлов Valve"
        run: bash scripts/check-no-valve-files.sh

      - name: Установка зависимостей
        working-directory: web
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Сборка
        working-directory: web
        env:
          # Сайт живёт в подкаталоге /<репозиторий>/
          VITE_BASE: /${{ github.event.repository.name }}/
          # '' не подходит: на Pages нет /api. 'none' = только офлайн.
          VITE_API_BASE: ${{ vars.API_BASE || 'none' }}
          # Pages не даёт задать COOP/COEP — их добавляет service worker
          VITE_COI_SW: '1'
          # Pages сжимает ответы сам и не отдаёт .br/.gz
          POSTBUILD_NO_COMPRESS: '1'
        run: npm run build

      - name: Без Jekyll
        run: touch web/dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
